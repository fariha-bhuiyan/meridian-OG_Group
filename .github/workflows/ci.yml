name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the app loads
        run: node -e "require('./src/app')"
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci --reporters=default --reporters=github-actions
     
      - name: Check dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose

  package:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION=$(node -p "require('./package.json').version")
          docker build -t "$IMAGE:$VERSION" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
